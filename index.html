<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ղարս Գարդեն — ցուցադրական տարբերակներ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wdth,wght@62.5..100,200..500&family=Noto+Serif+Armenian:wdth,wght@62.5..100,200..500&family=Google+Sans:wght@400..600&display=swap" rel="stylesheet">
<style>
  /* Страница выбора: два варианта демо. Цвета — из палитры «Ночной сад» варианта 2 */
  :root { --bg: #0C110E; --bg-2: #111813; --text: #EFE9DC; --muted: rgba(239, 233, 220, .62); --line: rgba(239, 233, 220, .16); --accent: #D3A54F; --serif: "Noto Serif Armenian", "Noto Serif", Georgia, serif; --sans: "Google Sans", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 400 16px/1.5 var(--sans); min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: clamp(48px, 9vh, 96px) 16px 40px; }
  .eyebrow { font: 600 11.5px/1.3 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
  h1 { font: 200 clamp(40px, 8vw, 88px)/1 var(--serif); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 clamp(36px, 6vh, 56px); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2.6vw, 32px); }
  a.card { display: block; color: inherit; text-decoration: none; }
  .ph { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--bg-2); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); }
  .ph::after { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(239, 233, 220, .5); pointer-events: none; }
  a.card:hover .ph img { transform: scale(1.04); }
  .cap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .cap b { font: 300 clamp(22px, 2.6vw, 30px)/1.1 var(--serif); letter-spacing: .04em; text-transform: uppercase; }
  .cap span { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .go { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin-top: 14px; background: var(--accent); color: #17130A; font: 600 15px/1 var(--sans); }
  .card.light .go { background: transparent; color: var(--text); border: 1px solid rgba(239, 233, 220, .4); }
  footer { text-align: center; font-size: 12.5px; color: var(--muted); padding: 0 16px 28px; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; gap: 40px; }
    .ph { aspect-ratio: 4 / 3; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Կայքի ցուցադրական տարբերակներ</p>
  <h1>Ղարս Գարդեն</h1>
  <div class="grid">
    <a class="card" href="2/">
      <div class="ph"><img src="img/evening.jpg" alt=""></div>
      <div class="cap"><b>Տարբերակ 2</b><span>Գիշերային այգի</span></div>
      <span class="go">Բացել</span>
    </a>
    <a class="card light" href="1/">
      <div class="ph"><img src="img/pavilion-wood.jpg" alt=""></div>
      <div class="cap"><b>Տարբերակ 1</b><span>Լուսավոր</span></div>
      <span class="go">Բացել</span>
    </a>
  </div>
</main>
<footer>Ցուցադրական տարբերակ՝ «Ղարս Գարդեն»-ի սեփականատիրոջ համար։ Սա պաշտոնական կայք չէ։</footer>
</body>
</html>
